name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'harryxu/emdash-popcase' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version from the release tag
        run: node scripts/prepare-release.ts "$RELEASE_TAG"

      - name: Run tests
        run: pnpm test

      - name: Check types
        run: pnpm typecheck

      - name: Verify the packed package in a fresh consumer
        run: pnpm test:package

      - name: Pack the release
        run: npm pack --ignore-scripts

      - name: Publish with npm trusted publishing
        run: npm publish "./emdash-popcase-${RELEASE_TAG#v}.tgz" --access public --provenance --ignore-scripts
